[package]
name = "izlek-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Izlek web app: topcoat UI, routes and the server"

[dependencies]
topcoat = { version = "0.6.2", default-features = false, features = [
  "router",
  "view",
  "runtime",
  "asset",
  "cookie",
  "discover",
  "serve",
  "compression",
  "multipart",
] }
izlek-core = { workspace = true, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
async-trait = "0.1.92"
# TLS through rustls with the ring provider: no OpenSSL on the deployment box,
# and no system certificate store to be missing inside a container.
lettre = { version = "0.11.23", default-features = false, features = [
  "smtp-transport",
  "builder",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
  "pool",
] }

[build-dependencies]
grass = "0.13"

[dev-dependencies]
http = "1.5"
