[package]
name = "iz-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain model and storage for İz"

[features]
# The domain vocabulary (roles, record shapes) compiles anywhere, including the
# wasm bundle. Everything that touches a database, a password or a CSPRNG lives
# behind `server` so none of it is shipped to the browser.
default = ["server"]
server = [
  "dep:async-trait",
  "dep:base64",
  "dep:chacha20poly1305",
  "dep:rand",
  "dep:tokio",
  "dep:turso",
  "dep:ulid",
]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tokio = { workspace = true, optional = true }
turso = { workspace = true, optional = true }
ulid = { workspace = true, optional = true }

[dev-dependencies]
async-trait = "0.1.92"
serde_json.workspace = true
tokio = { workspace = true }
tempfile = "3"
zip.workspace = true
