on:
  push:
    branches:
      - main

# The deploy swaps a release directory and restarts one service; two of them
# racing would leave the binary and the running process from different builds.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # A static binary: it runs on the server whatever its glibc is, and the
  # server needs nothing installed to keep it running.
  TARGET: x86_64-unknown-linux-musl
  # The systemd user unit that owns the process. See izlek.service.
  SERVICE: izlek
  # `release` keeps fat LTO in one codegen unit for when the last few percent
  # are worth five minutes. `dist` is that profile with thin LTO and the cores
  # actually used: measured on a 12-core machine, the relink every deploy pays
  # for goes from 2m27s to 25s, for a binary this server will never be
  # CPU-bound on. See the profile in Cargo.toml.
  PROFILE: dist
  TOPCOAT: 0.6.2

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      # Compiling the CLI from source costs minutes and it changes only when
      # the pinned version does, so it is cached on that version alone.
      - name: Cache the topcoat CLI
        id: topcoat-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-${{ env.TOPCOAT }}-${{ runner.os }}

      - name: Install the topcoat CLI
        # Installed before the cargo config below exists, so the CLI itself is
        # built for the host and not for musl.
        if: steps.topcoat-cache.outputs.cache-hit != 'true'
        run: cargo install topcoat-cli@${{ env.TOPCOAT }} --locked

      - name: Point cargo at musl
        run: |
          set -euo pipefail
          # `topcoat asset bundle` runs its own `cargo build` and strips every
          # CARGO_* variable from it, so the target cannot be passed by
          # environment; it goes into the cargo config that inner build reads.
          # This file is written in CI only; it is not committed.
          mkdir -p .cargo
          printf '[build]\ntarget = "%s"\n' "$TARGET" >> .cargo/config.toml
          # The linker stays rustc's default (the bundled rust-lld): a warm
          # relink of this binary measured 142s under musl-gcc's BFD against
          # 23s under rust-lld, and that link was the largest single chunk of
          # the deploy build. musl-gcc remains the C compiler below — ring's
          # assembly needs it, and lld links the objects it produces.
          # C dependencies (ring, under lettre's TLS) compile against musl too.
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build the binary and bundle its assets
        run: |
          set -euo pipefail
          # One compile: this builds izlek-web and writes out the asset bundle
          # embedded in the binary it produced.
          topcoat asset bundle --package izlek-web --profile "$PROFILE" --out stage/assets
          cp "target/$TARGET/$PROFILE/izlek-web" stage/izlek-web
          strip stage/izlek-web
          ls -l stage stage/assets

      - name: Install SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Upload the release
        run: |
          set -euo pipefail
          deploy_path="${{ secrets.DEPLOY_PATH }}"
          ssh_target="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          ssh "$ssh_target" "
            set -eu
            case '${deploy_path}' in
              ''|/|/home|/home/|/srv|/srv/|/var|/var/)
                echo 'Refusing to deploy to a broad or empty path: ${deploy_path}' >&2
                exit 1
                ;;
            esac
            # The deploy path is the service's working directory: config/,
            # izlek.db and izlek.key live there and are never touched from here.
            # Only 'current' is replaced.
            mkdir -p -- '${deploy_path}'
            rm -rf -- '${deploy_path}/current.new'
            mkdir -p -- '${deploy_path}/current.new'
          "
          tar -C stage -czf - . | ssh "$ssh_target" "tar -xzf - -C '${deploy_path}/current.new'"

      - name: Swap and restart
        run: |
          set -euo pipefail
          deploy_path="${{ secrets.DEPLOY_PATH }}"
          ssh_target="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          ssh "$ssh_target" "
            set -eu
            export XDG_RUNTIME_DIR=/run/user/\$(id -u)
            # Read before anything moves: a config the health check cannot
            # read is a failure to stop on, not one to roll back from.
            listen=\$(sed -n 's/^listen[[:space:]]*=[[:space:]]*\"\(.*\)\"/\1/p' '${deploy_path}/config/izlek.toml')
            if [ -z \"\$listen\" ]; then
              echo 'no listen address in ${deploy_path}/config/izlek.toml' >&2
              exit 1
            fi
            chmod +x -- '${deploy_path}/current.new/izlek-web'
            rm -rf -- '${deploy_path}/current.previous'
            if [ -e '${deploy_path}/current' ]; then
              mv -- '${deploy_path}/current' '${deploy_path}/current.previous'
            fi
            mv -- '${deploy_path}/current.new' '${deploy_path}/current'
            systemctl --user restart '${{ env.SERVICE }}'
            # The unit is Type=simple, so a restart returns before the process
            # has bound its port. Wait for the health route rather than a clock.
            for _ in \$(seq 1 30); do
              if curl -fsS \"http://\${listen}/healthz\" >/dev/null 2>&1; then
                echo 'izlek is up'
                rm -rf -- '${deploy_path}/current.previous'
                exit 0
              fi
              sleep 1
            done
            echo 'izlek did not answer /healthz; rolling back' >&2
            rm -rf -- '${deploy_path}/current'
            mv -- '${deploy_path}/current.previous' '${deploy_path}/current'
            systemctl --user restart '${{ env.SERVICE }}'
            exit 1
          "

      - name: Cleaning
        run: rm -rf ~/.ssh
