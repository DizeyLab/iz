[workspace]
resolver = "3"
members = ["crates/izlek-core", "crates/izlek-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IzlekLab/izlek"

[workspace.dependencies]
izlek-core = { path = "crates/izlek-core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
ulid = "1"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
turso = "=0.8.0-pre.7"
argon2 = "0.6.0-rc.8"
rand = "0.10.2"
sha2 = "0.11.0"
subtle = "2.6.1"
chacha20poly1305 = "0.10.1"
base64 = "0.22.1"
toml = "1"

# A dev build runs the same spreadsheet reader a release build does, and an
# unoptimised quick-xml walks a wide sheet about twenty times slower — a page
# of a 1,200-column book took two seconds to open on `cargo run`. Dependencies
# are compiled optimised even in dev; the workspace's own crates stay
# unoptimised, so an edit still rebuilds in a second.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
