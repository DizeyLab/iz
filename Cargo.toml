[workspace]
resolver = "3"
members = ["crates/dizey-core", "crates/dizey-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/DizeyLab/izlek"

[workspace.dependencies]
dizey-core = { path = "crates/dizey-core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
turso = "=0.8.0-pre.7"
argon2 = "0.6.0-rc.8"
rand = "0.10.2"
sha2 = "0.11.0"
subtle = "2.6.1"
chacha20poly1305 = "0.10.1"
base64 = "0.22.1"

[profile.release]
codegen-units = 1
lto = true

# cargo-leptos drives the two-target (server bin + wasm lib) build.
[[workspace.metadata.leptos]]
name = "dizey"
bin-package = "dizey-web"
lib-package = "dizey-web"
output-name = "dizey"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
panic = "abort"
